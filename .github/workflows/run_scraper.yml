name: Automatisation France Galop (Quotidien & Hebdo)

on:
  schedule:
    # Quotidien : 04:00 UTC (05h00 ou 06h00 heure de Paris)
    - cron: '0 4 * * *'
    # Hebdomadaire : Tous les lundis à 07:00 UTC (08h00 ou 09h00 heure de Paris)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      script_to_run:
        description: 'Sélectionnez le script à exécuter :'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - scraper (quotidien)
          - gain (hebdomadaire)

jobs:
  france-galop-tasks:
    runs-on: ubuntu-latest
    environment: login
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restauration du cache des cookies
        uses: actions/cache@v4
        with:
          path: cookies.json
          key: fg-cookies-${{ github.run_id }}
          restore-keys: |
            fg-cookies-

      - name: Installation de XVFB
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager requests undetected-chromedriver

      - name: Exécution du Scraper Quotidien (Partants)
        if: |
          github.event.schedule == '0 4 * * *' ||
          (github.event_name == 'workflow_dispatch' && (inputs.script_to_run == 'all' || inputs.script_to_run == 'scraper (quotidien)'))
        env:
          FG_PASSWORD: ${{ secrets.FG_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
        run: xvfb-run --auto-servernum python scraper.py

      - name: Exécution du Rapport Hebdomadaire (Gain/Top 4)
        if: |
          github.event.schedule == '0 7 * * 1' ||
          (github.event_name == 'workflow_dispatch' && (inputs.script_to_run == 'all' || inputs.script_to_run == 'gain (hebdomadaire)'))
        env:
          FG_PASSWORD: ${{ secrets.FG_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
        run: xvfb-run --auto-servernum python gain.py

      - name: Sauvegarder les captures d'écran (Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 2
